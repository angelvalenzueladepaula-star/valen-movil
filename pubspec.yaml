name: valen_movil
description: VALEN para Android. Un asistente que vive en una V flotante.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # La burbuja flotante encima de todo y el servicio que la mantiene viva
  flutter_overlay_window:
  flutter_foreground_task:

  # Oir y hablar
  speech_to_text:
  flutter_tts:

  # El cerebro: Gemini, que ademas lee imagenes
  google_generative_ai:

  # Cuenta de usuario y su base de datos
  supabase_flutter:

  # Cuestionarios: fotos de los apuntes
  image_picker:

  # El historial de conversaciones, guardado en el propio aparato.
  # La version _web hace que tambien funcione en el navegador, guardando en
  # IndexedDB en vez de en un archivo.
  sqflite:
  sqflite_common_ffi_web:
  path_provider:

  # Guardar la clave del cerebro donde no la vea nadie
  flutter_secure_storage:
  shared_preferences:

  # Nota: aqui habia cinco paquetes mas (permission_handler, battery_plus,
  # sensors_plus, http, intl) puestos "por si acaso" para el saludo de la
  # manana y el modo seguridad, que todavia no estan escritos. Ninguno se
  # usaba, y permission_handler ademas rompia la compilacion del APK por pedir
  # una version de Kotlin mas nueva.
  #
  # Se vuelven a poner cuando de verdad hagan falta. Cada dependencia que
  # sobra es un permiso de mas que pide la aplicacion y una cosa mas que se
  # puede romper sola.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:
  # Para poder probar el historial de verdad en el ordenador, sin telefono
  sqflite_common_ffi:

flutter:
  uses-material-design: true
